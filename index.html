    <style>

        :root {

            --bg:
                    #090b0f;

            --bg-soft:
                    #10141a;

            --card:
                    rgba(255,255,255,.055);

            --card-hover:
                    rgba(255,255,255,.085);

            --gold:
                    #d9b45d;

            --gold-light:
                    #f1d78e;

            --gold-dark:
                    #94733a;

            --text:
                    #f5f2ea;

            --muted:
                    #9da3ad;

            --border:
                    rgba(217,180,93,.22);

            --green:
                    #73c6a2;

            --shadow:
                    0 25px 80px rgba(0,0,0,.45);

        }

        * {

            margin: 0;
            padding: 0;
            box-sizing: border-box;

        }

        html {

            scroll-behavior: smooth;

        }

        body {

            min-height: 100vh;

            background:

                    radial-gradient(
                            circle at 85% 5%,
                            rgba(217,180,93,.13),
                            transparent 25%
                    ),

                    radial-gradient(
                            circle at 10% 50%,
                            rgba(89,124,112,.08),
                            transparent 30%
                    ),

                    var(--bg);

            color: var(--text);

            font-family:
                    "Cairo",
                    sans-serif;

            overflow-x: hidden;

        }

        body::before {

            content: "";

            position: fixed;

            inset: 0;

            pointer-events: none;

            opacity: .18;

            background-image:

                    linear-gradient(
                            30deg,
                            rgba(255,255,255,.025) 12%,
                            transparent 12.5%,
                            transparent 87%,
                            rgba(255,255,255,.025) 87.5%
                    ),

                    linear-gradient(
                            150deg,
                            rgba(255,255,255,.025) 12%,
                            transparent 12.5%,
                            transparent 87%,
                            rgba(255,255,255,.025) 87.5%
                    );

            background-size: 80px 140px;

            z-index: -1;

        }

        .container {

            width: min(
                    1180px,
                    calc(100% - 40px)
            );

            margin: auto;

        }

        /* =========================
           NAVBAR
        ========================= */

        nav {

            position: fixed;

            top: 0;

            left: 0;

            width: 100%;

            z-index: 1000;

            padding: 18px 0;

            transition: .3s;

        }

        nav.scrolled {

            background:
                    rgba(9,11,15,.78);

            backdrop-filter:
                    blur(20px);

            border-bottom:
                    1px solid
                    rgba(255,255,255,.07);

        }

        .nav-inner {

            display: flex;

            align-items: center;

            justify-content: space-between;

        }

        .brand {

            display: flex;

            align-items: center;

            gap: 12px;

            color: var(--text);

            text-decoration: none;

            font-size: 24px;

            font-weight: 900;

        }

            width: 48px;

            height: 48px;

            border-radius: 15px;

            display: grid;

            place-items: center;

            font-size: 25px;
